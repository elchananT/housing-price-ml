[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "housing-price-ml"
version = "1.0.0"
description = "Reproducible, leakage-safe house-price regression on the Ames housing data, with calibrated prediction intervals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elchanan Treistman" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "optuna>=3.6",
    "shap>=0.45",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "pydantic>=2.7",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "nbconvert>=7", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
housing-predict = "housing.predict:main"
housing-train = "housing.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/housing"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "NPY", "PD"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
